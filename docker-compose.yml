services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb-aulavirtual
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: AD_aulavirtual
    ports:
      - "3306:3306"
    volumes:
      - datos_aulavirtual:/var/lib/mysql

volumes:
  datos_aulavirtual: